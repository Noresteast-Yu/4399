services:
  mysql:
    image: mysql:8.0
    container_name: smart-travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: smart_travel_dev
      MYSQL_DATABASE: smart_travel
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - smart-travel-mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./migrations/004_full_shanghai_metro_network.sql:/docker-entrypoint-initdb.d/03_full_shanghai_metro_network.sql:ro
      - ./migrations/002_station_facility_details.sql:/docker-entrypoint-initdb.d/04_station_facility_details.sql:ro
      - ./migrations/003_static_resources.sql:/docker-entrypoint-initdb.d/05_static_resources.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psmart_travel_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  smart-travel-mysql-data:
